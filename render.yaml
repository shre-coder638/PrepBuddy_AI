services:
  - type: web
    name: prepbuddy-ann-staging
    runtime: docker
    region: singapore
    plan: free
    branch: feature/option-b-ann
    autoDeployTrigger: "off"

    dockerfilePath: ./Dockerfile.render
    dockerContext: .

    healthCheckPath: /healthz/

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: STAGING_ACCESS_TOKEN
        generateValue: true

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        sync: false

      - key: REMOTE_ANN_URL
        sync: false

      - key: ANN_SERVICE_TOKEN
        sync: false

      - key: STAGING_EXTERNAL_CONNECTIONS
        value: "False"

      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: prepbuddy-ann-staging
          envVarKey: RENDER_EXTERNAL_HOSTNAME

      - key: CSRF_TRUSTED_ORIGINS
        fromService:
          type: web
          name: prepbuddy-ann-staging
          envVarKey: RENDER_EXTERNAL_URL

      - key: CORS_ALLOWED_ORIGINS
        value: ""

      - key: DEBUG
        value: "False"

      - key: STAGING_MODE
        value: "True"

      - key: CHATBOT_BACKEND
        value: remote_ann

      - key: ANN_RECORD_EXPERIENCES
        value: "False"

      - key: EMAIL_SEND_ENABLED
        value: "False"

      - key: WHATSAPP_SEND_ENABLED
        value: "False"






      - key: SECURE_SSL_REDIRECT
        value: "True"

      - key: SESSION_COOKIE_SECURE
        value: "True"

      - key: CSRF_COOKIE_SECURE
        value: "True"

      - key: SECURE_HSTS_SECONDS
        value: "3600"
